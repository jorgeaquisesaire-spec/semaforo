<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio 03: Semáforo Automático</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f6f9;
            font-family: Arial, sans-serif;
            margin: 0;
            text-align: center; 
        }

        /* [Punto Extra] Animación CSS de latido suave */
        @keyframes latidoLuz {
            0% { opacity: 1; filter: drop-shadow(0 0 5px rgba(255,255,255,0.5)); }
            50% { opacity: 0.85; filter: drop-shadow(0 0 20px var(--brillo-color)); }
            100% { opacity: 1; filter: drop-shadow(0 0 5px rgba(255,255,255,0.5)); }
        }

        .encendida {
            animation: latidoLuz 1.5s infinite ease-in-out;
        }

        /* Variables CSS para el brillo dinámico de la animación */
        #rojo.encendida { --brillo-color: #ff3b30; }
        #ambar.encendida { --brillo-color: #ffcc00; }
        #verde.encendida { --brillo-color: #4cd964; }

        button {
            margin-top: 25px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            color: #333;
            background-color: #fff;
            border: 2px solid #222;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: #222;
            color: #fff;
        }
    </style>
</head>
<body>

    <h1>Semáforo SVG</h1>

    <!-- CRITERIO: El SVG usa viewBox y las figuras están dentro del lienzo -->
    <svg width="140" height="360" viewBox="0 0 140 360">
        <!-- Sombrero / Visera superior en color gris encima del semáforo -->
        <path d="M 30 30 Q 70 5 110 30 Z" fill="#777" />
        <rect width="80" height="6" x="30" y="27" rx="2" ry="2" fill="#555" />

        <!-- Caja del semáforo -->
        <rect width="120" height="320" x="10" y="30" rx="20" ry="20" fill="#222" />
        
        <!-- ================= LUCES CON FONDO DE COLOR ================= -->
        <!-- Fondo Rojo Fijo + Luz Interactiva con ID -->
        <circle cx="70" cy="90" r="38" fill="#5a1816" /> <!-- Aro de fondo oscuro -->
        <circle id="rojo" cx="70" cy="90" r="32" fill="#444" />
        
        <!-- Fondo Amarillo Fijo + Luz Interactiva con ID -->
        <circle cx="70" cy="190" r="38" fill="#544403" /> <!-- Aro de fondo oscuro -->
        <circle id="ambar" cx="70" cy="190" r="32" fill="#444" />
        
        <!-- Fondo Verde Fijo + Luz Interactiva con ID -->
        <circle cx="70" cy="290" r="38" fill="#0f3d1b" /> <!-- Aro de fondo oscuro -->
        <circle id="verde" cx="70" cy="290" r="32" fill="#444" />
    </svg>

    <!-- Botón de interacción manual -->
    <button id="btn-avanzar">Cambiar Luz</button>

    <script>
        // CRITERIO: Selecciona los nodos con querySelector (Mismos códigos intactos)
        const luzRojo = document.querySelector('#rojo');
        const luzAmbar = document.querySelector('#ambar');
        const luzVerde = document.querySelector('#verde');
        const botonAvanzar = document.querySelector('#btn-avanzar');

        // Configuración y orden secuencial del semáforo
        const secuenciaLuces = [
            { nodo: luzRojo, colorActivo: '#ff3b30', tiempo: 3000 },  // 3s rojo
            { nodo: luzAmbar, colorActivo: '#ffcc00', tiempo: 1000 }, // 1s ámbar
            { nodo: luzVerde, colorActivo: '#4cd964', tiempo: 3000 }  // 3s verde
        ];
        const colorApagado = '#444';
        
        let indiceActual = 0;
        let temporizador;

        // CRITERIO: Existe la función encender() y evita código repetido
        function encender(indice) {
            secuenciaLuces.forEach((item, idx) => {
                if (idx === indice) {
                    // CRITERIO: Cambia el color con setAttribute
                    item.nodo.setAttribute('fill', item.colorActivo);
                    item.nodo.classList.add('encendida');
                } else {
                    item.nodo.setAttribute('fill', colorApagado);
                    item.nodo.classList.remove('encendida');
                }
            });
            indiceActual = indice;
        }

        // CRITERIO: El ciclo avanza solo con temporizador y respeta los tiempos
        function iniciarCicloAutomatico() {
            encender(indiceActual);

            // Obtiene el tiempo específico asignado a la luz actual
            const tiempoEspera = secuenciaLuces[indiceActual].tiempo;
            const siguienteIndice = (indiceActual + 1) % secuenciaLuces.length;

            temporizador = setTimeout(() => {
                indiceActual = siguienteIndice;
                iniciarCicloAutomatico();
            }, tiempoEspera);
        }

        // CRITERIO: El botón funciona con addEventListener
        botonAvanzar.addEventListener('click', () => {
            clearTimeout(temporizador); // Limpia el flujo para que no se crucen los tiempos
            indiceActual = (indiceActual + 1) % secuenciaLuces.length;
            iniciarCicloAutomatico();
        });

        // CRITERIO: El archivo abre en el navegador sin errores en consola
        window.addEventListener('DOMContentLoaded', () => {
            iniciarCicloAutomatico();
        });
    </script>

</body>
</html>
